# Nginx reverse-proxy config for goodgurl.gg
# Place at /etc/nginx/sites-available/goodgurl.gg and symlink to sites-enabled/.
# Assumes:
#   - Certbot/Let's Encrypt certs at the standard paths
#   - gunicorn listening on 127.0.0.1:8000
#   - Static files served directly from /srv/goodgurl.gg/static/

upstream app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name goodgurl.gg www.goodgurl.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://goodgurl.gg$request_uri;
    }
}

# Redirect www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.goodgurl.gg;

    ssl_certificate     /etc/letsencrypt/live/goodgurl.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodgurl.gg/privkey.pem;

    return 301 https://goodgurl.gg$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goodgurl.gg;

    ssl_certificate     /etc/letsencrypt/live/goodgurl.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodgurl.gg/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (Flask also sets these; Nginx layer is belt-and-suspenders)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20M;
    keepalive_timeout 65;

    # Serve static files directly — bypass gunicorn entirely
    location /static/ {
        alias /srv/goodgurl.gg/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    # Local uploads (only used when S3 is NOT configured)
    location /uploads/ {
        alias /srv/goodgurl.gg/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else to gunicorn
    location / {
        proxy_pass         http://app;
        proxy_redirect     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Health-check endpoint — used by load balancers / uptime monitors
    location = /healthz {
        proxy_pass http://app;
        access_log off;
    }

    access_log  /var/log/nginx/goodgurl.gg.access.log;
    error_log   /var/log/nginx/goodgurl.gg.error.log warn;
}
